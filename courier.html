<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123b78"><title>App del mensajero · NPL</title><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/styles.css"></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-logo">NPL</span><span><b>NPL Logística</b><small>App del mensajero</small></span></a><button id="logout" class="link-btn hidden">Salir</button></header><main class="page"><section id="loginPanel" class="panel login-panel"><p class="eyebrow">ACCESO DEL MENSAJERO</p><h1>Iniciar sesión</h1><p class="muted">Usa la cuenta que te asignó NPL.</p><form id="loginForm" class="stack"><label>Correo<input id="email" type="email" autocomplete="username" required></label><label>Contraseña<input id="password" type="password" autocomplete="current-password" required></label><button class="primary">Entrar</button><p id="loginMessage" class="message" aria-live="polite"></p></form></section><div id="appPanel" class="hidden"><section class="welcome"><div><p class="eyebrow">TU RUTA</p><h1>Hola, <span id="courierName">mensajero</span></h1><p id="pushStatus">Activa las notificaciones para recibir nuevos pedidos.</p></div><button id="enablePush" class="primary">Activar avisos</button></section><div class="tabs"><button class="tab active" data-filter="active">Por entregar <span id="activeCount">0</span></button><button class="tab" data-filter="all">Historial</button></div><div id="orders" class="order-list"></div></div></main><dialog id="deliverDialog" class="dialog"><form id="deliverForm" class="stack"><button type="button" id="closeDialog" class="dialog-close" aria-label="Cerrar">×</button><p class="eyebrow">CONFIRMAR ENTREGA</p><h2>Verifica el código</h2><p class="muted">Pide al cliente el código único del pedido antes de confirmar.</p><input id="deliveryCode" class="code-field" inputmode="text" autocomplete="off" placeholder="NPL123456" required maxlength="9"><p id="deliverMessage" class="message" aria-live="polite"></p><button class="primary">Confirmar entrega</button></form></dialog><div id="toast" class="toast" role="status"></div><script type="module" src="/src/courier.js"></script></body></html>
