<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Educativa Infantil</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f2f6ff;
}

header{
background:#4CAF50;
color:white;
text-align:center;
padding:15px;
font-size:18px;
}

.menu{
display:flex;
flex-direction:column;
padding:15px;
gap:10px;
}

button{
padding:15px;
border:none;
border-radius:12px;
font-size:16px;
cursor:pointer;
background:#2196F3;
color:white;
}

.section{
display:none;
padding:15px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.card{
background:white;
padding:10px;
border-radius:12px;
text-align:center;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
cursor:pointer;
}

.card:active{
transform:scale(0.97);
}

.color{
height:60px;
border-radius:10px;
margin-bottom:5px;
}

.flag{
width:100%;
height:90px;
object-fit:contain;
background:white;
border-radius:10px;
padding:5px;
}

.back{
background:#ff9800;
margin-bottom:10px;
}

@media(max-width:600px){
.grid{grid-template-columns:repeat(2,1fr);}
}

</style>
</head>

<body>

<header>🎓 Colores y Banderas</header>

<!-- MENU -->
<div class="menu" id="menu">
<button onclick="openSection('colors')">🎨 Conociendo los Colores</button>
<button onclick="openSection('flags')">🌍 Banderas del Mundo</button>
</div>

<!-- COLORES -->
<div id="colors" class="section">

<button class="back" onclick="back()">⬅ Volver</button>

<h3>🎨 Colores</h3>

<div class="grid">

<div class="card" onclick="say('rojo')">
<div class="color" style="background:red"></div>
Rojo
</div>

<div class="card" onclick="say('azul')">
<div class="color" style="background:blue"></div>
Azul
</div>

<div class="card" onclick="say('verde')">
<div class="color" style="background:green"></div>
Verde
</div>

<div class="card" onclick="say('amarillo')">
<div class="color" style="background:yellow"></div>
Amarillo
</div>

<div class="card" onclick="say('naranja')">
<div class="color" style="background:orange"></div>
Naranja
</div>

<div class="card" onclick="say('morado')">
<div class="color" style="background:purple"></div>
Morado
</div>

<div class="card" onclick="say('negro')">
<div class="color" style="background:black"></div>
Negro
</div>

<div class="card" onclick="say('blanco')">
<div class="color" style="background:#eee"></div>
Blanco
</div>

<div class="card" onclick="say('rosado')">
<div class="color" style="background:pink"></div>
Rosado
</div>

<div class="card" onclick="say('gris')">
<div class="color" style="background:gray"></div>
Gris
</div>

<div class="card" onclick="say('café')">
<div class="color" style="background:#6b3e26"></div>
Café
</div>

<div class="card" onclick="say('celeste')">
<div class="color" style="background:skyblue"></div>
Celeste
</div>

</div>
</div>

<!-- BANDERAS -->
<div id="flags" class="section">

<button class="back" onclick="back()">⬅ Volver</button>

<h3>🌍 Banderas del Mundo</h3>

<div class="grid">

<div class="card" onclick="say('Colombia amarillo azul rojo')">
<img class="flag" src="https://flagcdn.com/w320/co.png">
Colombia
</div>

<div class="card" onclick="say('México verde blanco rojo')">
<img class="flag" src="https://flagcdn.com/w320/mx.png">
México
</div>

<div class="card" onclick="say('Argentina celeste blanco celeste')">
<img class="flag" src="https://flagcdn.com/w320/ar.png">
Argentina
</div>

<div class="card" onclick="say('Brasil verde amarillo azul')">
<img class="flag" src="https://flagcdn.com/w320/br.png">
Brasil
</div>

<div class="card" onclick="say('Chile rojo blanco azul')">
<img class="flag" src="https://flagcdn.com/w320/cl.png">
Chile
</div>

<div class="card" onclick="say('Perú rojo blanco rojo')">
<img class="flag" src="https://flagcdn.com/w320/pe.png">
Perú
</div>

<div class="card" onclick="say('España rojo amarillo rojo')">
<img class="flag" src="https://flagcdn.com/w320/es.png">
España
</div>

<div class="card" onclick="say('Francia azul blanco rojo')">
<img class="flag" src="https://flagcdn.com/w320/fr.png">
Francia
</div>

<div class="card" onclick="say('Italia verde blanco rojo')">
<img class="flag" src="https://flagcdn.com/w320/it.png">
Italia
</div>

<div class="card" onclick="say('Alemania negro rojo amarillo')">
<img class="flag" src="https://flagcdn.com/w320/de.png">
Alemania
</div>

<div class="card" onclick="say('Estados Unidos rojo blanco azul')">
<img class="flag" src="https://flagcdn.com/w320/us.png">
EE.UU
</div>

<div class="card" onclick="say('Canadá rojo blanco rojo')">
<img class="flag" src="https://flagcdn.com/w320/ca.png">
Canadá
</div>

</div>
</div>

<script>

// VOZ
function say(text){
let msg = new SpeechSynthesisUtterance(text);
msg.lang = "es-ES";
speechSynthesis.speak(msg);
}

// abrir sección
function openSection(id){
document.getElementById("menu").style.display="none";
document.getElementById(id).style.display="block";
}

// volver
function back(){
document.querySelectorAll(".section").forEach(s=>s.style.display="none");
document.getElementById("menu").style.display="flex";
}

</script>

</body>
</html>
